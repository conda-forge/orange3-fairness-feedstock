{% set name = "Orange3-Fairness" %}
{% set source_name = "orange3_fairness" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ source_name }}-{{ version }}.tar.gz
  sha256: a843ed3fbc092485e9465f6762a657d8b4f030bbfdb1331f490251fec5051100

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - wheel
    - recommonmark
  run:
    - python >={{ python_min }}
    - aif360 >=0.6.0
    - numpy >=1.24.0
    - orange3 >=3.32.0
    - setuptools >=51.0.0

test:
  imports:
    - orangecontrib
  commands:
    # - pip check temporarily disabled because of issues with the package serverfiles
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://orangedatamining.com/
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: "Orange3 add-on for fairness-aware machine learning."
  doc_url: https://orange3-fairness.readthedocs.io/en/latest/
  dev_url: https://github.com/biolab/orange3-fairness

extra:
  recipe-maintainers:
    - ZanMervic
    - PrimozGodec
    - HeavyTony2
    - markotoplak
